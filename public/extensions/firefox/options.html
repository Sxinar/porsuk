<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Porsuk Uzantı Ayarı (Firefox)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; color: #1f1f1f; }
      .card { max-width: 640px; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
      label { display: block; font-size: 14px; margin-bottom: 8px; }
      input { width: 100%; height: 40px; padding: 0 10px; border: 1px solid #ccc; border-radius: 8px; }
      button { margin-top: 12px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      p { font-size: 13px; color: #666; }
      .ok { color: #0f766e; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Porsuk Uzantı Ayarı (Firefox)</h1>
      <label for="base">Porsuk adresi (örn: https://porsuk.vercel.app)</label>
      <input id="base" placeholder="https://porsuk.vercel.app" />
      <button id="save">Kaydet</button>
      <p id="status"></p>
      <p>Kaydettikten sonra sayfada sağ tık yapıp <b>Porsuk ile Oku</b> seçeneğini kullanabilirsiniz.</p>
    </div>
    <script src="options.js"></script>
  </body>
</html>
